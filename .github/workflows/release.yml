name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;28.2.13676358" "cmake;3.22.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        env:
          OPENTERMINAL_KEYSTORE: ${{ runner.temp }}/release.jks
          OPENTERMINAL_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          OPENTERMINAL_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          OPENTERMINAL_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          cp "$APK" "OpenTerminal-${GITHUB_REF_NAME#v}.apk"
          sha256sum "OpenTerminal-${GITHUB_REF_NAME#v}.apk" > "OpenTerminal-${GITHUB_REF_NAME#v}.apk.sha256"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "OpenTerminal ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" OpenTerminal-*.apk OpenTerminal-*.apk.sha256 --clobber
